[bar]
order = [ "default", "bar" ]

    [bar.bar]
    center = [ "ram", "cpu" ]
    enabled = true
    end = [ "media", "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery" ]
    start = [ "clock", "workspaces" ]

    [bar.default]
    enabled = false

[desktop_widgets]
enabled = false

[location]
address = "Berlin, Germany"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1067.0
    cy = 1018.0
    output = "Virtual-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
avatar_path = "/home/leo/dotfiles/resources/profile-pictures/cat-white.jpg"
font_family = "JetBrainsMono NF"

    [shell.panel]
    wallpaper_placement = "floating"
    wallpaper_position = "center"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty", "mango" ]

[wallpaper]
directory = "/home/leo/dotfiles/resources/wallpapers"

    [wallpaper.automation]
    order = "alphabetical"

    [wallpaper.default]
    path = "/home/leo/dotfiles/resources/wallpapers/mountain-dark.png"

    [wallpaper.last]
    path = "/home/leo/dotfiles/resources/wallpapers/mountain-dark.png"
